name: Scottsdale Dance Lessons
neighborhood: North Phoenix
floor: Hardwood
notes: >-
  Scottsdale Dance Lessons is a premier, rapidly growing studio serving dancers
  throughout the greater Phoenix area. Recognized for high-caliber instruction
  and an inclusive community, the studio seamlessly blends an elevated modern
  aesthetic with a relaxed, welcoming atmosphere.


  Services include private instruction, tailored wedding choreography, and
  comprehensive ballroom and Latin programs, as well as weekly Country Swing and
  West Coast Swing classes and social events. Whether welcoming complete
  beginners or seasoned dancers, the studio remains committed to providing
  exceptional dance education, a strong community, and a consistently rewarding
  experience.
