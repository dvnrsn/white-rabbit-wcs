notes: >-
  Country Nomads is Veteran owned and operated dance business.


  Country Nomads owns a dance studio in Mesa Arizona, called Nomads Studio which
  opened Feb 2020. They offer group lessons, bootcamps, and private lessons six
  days a week with a focus on Country Swing and Line Dance.
   
  To help our students, we teach utilizing syllabus based lessons, created by
  Gabriel, called the Nomads Method. Our curriculum includes basics, timing, a
  set list of 24 beginner moves, footwork, drills and exercises for technique
  focused learning.  We also focus on Frame, Connection and Control and how they
  create safe, fun, and relaxed dancing to almost any music with no yanking or
  pulling. 
